<?xml version="1.0" encoding="UTF-8"?>
<!-- Pixel-art BPM logo (16x16 grid scaled) -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#000" />
  <!-- blue letter forms -->
  <g fill="#2EA0F2">
    <!-- b -->
    <rect x="0" y="1" width="2" height="8" />
    <rect x="2" y="1" width="3" height="2" />
    <rect x="2" y="3" width="3" height="2" />
    <rect x="2" y="5" width="3" height="2" />
    <!-- p -->
    <rect x="6" y="1" width="2" height="6" />
    <rect x="8" y="1" width="3" height="2" />
    <rect x="8" y="3" width="3" height="2" />
    <!-- m -->
    <rect x="12" y="3" width="1" height="6" />
    <rect x="13" y="5" width="1" height="4" />
    <rect x="14" y="7" width="1" height="2" />
  </g>
  <!-- lighter highlights -->
  <g fill="#9CD7FF">
    <rect x="2" y="1" width="1" height="1" />
    <rect x="8" y="1" width="1" height="1" />
    <rect x="13" y="5" width="1" height="1" />
  </g>
  <!-- green accents -->
  <g fill="#4EE07A">
    <rect x="3" y="2" width="1" height="1" />
    <rect x="9" y="2" width="1" height="1" />
    <rect x="13" y="6" width="1" height="1" />
  </g>
</svg>
</svg>
